name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/businessgpt-api/requirements.lock
      - run: pip install -r services/businessgpt-api/requirements.lock
      - run: python -m unittest discover -s services/businessgpt-api/tests -v
        env:
          PYTHONPATH: services/businessgpt-api

  bot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/businessgpt-bot/requirements.lock
      - run: pip install -r services/businessgpt-bot/requirements.lock
      - run: python -m unittest discover -s services/businessgpt-bot/tests -v
        env:
          PYTHONPATH: services/businessgpt-bot

  deployment-helper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/tests -v
