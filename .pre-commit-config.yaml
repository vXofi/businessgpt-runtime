default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: gitleaks-history
        name: Detect hardcoded secrets (history)
        entry: gitleaks git --redact --no-banner .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: public-boundary
        name: Public repository boundary
        entry: python3 scripts/check_public_boundary.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: public-boundary-history
        name: Public repository boundary (history)
        entry: python3 scripts/check_public_boundary.py --history
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
